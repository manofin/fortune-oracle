name: Public source guard

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  inspect-tracked-source:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
          fetch-depth: 0
      - name: Reject credentials and private runtime files in public history
        shell: bash
        run: |
          target=$(git rev-parse --verify HEAD)
          if [ "${GITHUB_REF_TYPE:-}" = tag ]; then
            target=$(git rev-parse --verify --end-of-options "$GITHUB_REF")
          fi
          python3 -B scripts/check_public_release.py --history "$target" --root .
